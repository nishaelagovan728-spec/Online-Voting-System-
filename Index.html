<!DOCTYPE html>
<html>
<head>
    <title>Online Voting System</title>
</head>
<body>
    <div class="container">
        <h1>Online Voting System</h1>

        <input type="text" id="voterName" placeholder="Enter Your Name">

        <h2>Select a Candidate</h2>

        <button onclick="vote('Candidate A')">Candidate A</button>
        <button onclick="vote('Candidate B')">Candidate B</button>

        <h2>Results</h2>
        <p id="result">
            Candidate A: 0 votes<br>
            Candidate B: 0 votes
        </p>

        <p id="message"></p>
    </div>
</body>
</html>
